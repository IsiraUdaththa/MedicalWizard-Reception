services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: reception
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
